name: catalog

on:
  push:
    branches: [main]
    paths: ['plugins/**', 'tools/**', 'catalog.json', 'eslint.config.mjs', 'package.json', 'package-lock.json', '.github/workflows/catalog.yml']
  pull_request:
    paths: ['plugins/**', 'tools/**', 'catalog.json', 'eslint.config.mjs', 'package.json', 'package-lock.json', '.github/workflows/catalog.yml']

permissions:
  contents: read

jobs:
  # A pull request, checked with main's rules (a pull request can't loosen the rules it is checked by): ESLint on
  # every plugin, every manifest, a higher version for a changed plugin, and catalog.json left alone.
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: git fetch --depth=1 origin main:refs/remotes/origin/main
      - name: catalog.json is written on merge
        run: |
          if ! git diff --quiet origin/main -- catalog.json; then
            echo "::error::catalog.json is written on merge; leave it out of the pull request"
            exit 1
          fi
      - name: main's rules
        run: git checkout origin/main -- tools eslint.config.mjs package.json package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx eslint --no-error-on-unmatched-pattern plugins
      - run: node tools/build-catalog.mjs --check

  # main: lint again, write catalog.json for the last commit that changed plugins/, and commit it when it changed.
  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: catalog
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npx eslint .
      - run: |
          at=$(git log -1 --format=%H -- plugins)
          node tools/build-catalog.mjs --commit "${at:-$(git rev-parse HEAD)}"
      - run: |
          git config user.name "otterm-catalog"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          if git diff --cached --quiet; then echo "catalog.json unchanged"; exit 0; fi
          git commit -m "catalog.json for $(git rev-parse --short HEAD) [skip ci]"
          git push
