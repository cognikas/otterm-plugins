name: catalog

on:
  push:
    branches: [main]
    paths: ['plugins/**', 'tools/**', 'types/**', 'tsconfig.json', 'eslint.config.mjs', 'package.json', 'package-lock.json', '.github/workflows/catalog.yml']
  # Every pull request: main requires this check, so it must run even when only the README changes.
  pull_request:
  # Publish the catalog again by hand (Actions → catalog → Run workflow), from main only.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A pull request, checked with main's rules (a pull request can't loosen the rules it is checked by): ESLint and
  # the types on every plugin, every manifest, and a higher version for a changed plugin.
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: git fetch --depth=1 origin main:refs/remotes/origin/main
      - name: main's rules
        run: git checkout origin/main -- tools types tsconfig.json eslint.config.mjs package.json package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx eslint --no-error-on-unmatched-pattern plugins
      - run: npx tsc -p tsconfig.json
      - run: node tools/build-catalog.mjs --check

  # main: lint and type-check again, write catalog.json for the last commit that changed plugins/, and publish it on
  # GitHub Pages (https://cognikas.github.io/otterm-plugins/catalog.json). Only main may publish there (the
  # github-pages environment's rule), and nothing is committed, so main stays protected with no exceptions.
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}catalog.json
    concurrency:
      group: catalog
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npx eslint .
      - run: npx tsc -p tsconfig.json
      - run: |
          at=$(git log -1 --format=%H -- plugins)
          node tools/build-catalog.mjs --commit "${at:-$(git rev-parse HEAD)}" --out _site/catalog.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
